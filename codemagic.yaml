# ─────────────────────────────────────────────────────────────
# Codemagic CI — بناء «مُلتزم» سحابياً بدون تثبيت Flutter محلياً
# الاستخدام: Start new build ← اختر workflow ← حمّل APK / IPA من Artifacts
# ─────────────────────────────────────────────────────────────
workflows:

  # 🤖 أندرويد: بناء APK خاص (توقيع تلقائي — يكفي للاستخدام الشخصي)
  android-apk:
    name: Android APK (تشغيل خاص)
    max_build_duration: 30
    instance_type: mac_mini_m2   # الخطة المجانية تدعم أجهزة Mac فقط (تبني أندرويد عادي)
    environment:
      flutter: stable
    scripts:
      - name: تجهيز المنصة ونسخ ملفات النشر
        script: |
          cp deploy/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r deploy/icons/android/res/* android/app/src/main/res/
          mkdir -p android/app/src/main/res/raw
          cp assets/sounds/*.mp3 android/app/src/main/res/raw/
          # تفعيل Core Library Desugaring (إلزامي لـ flutter_local_notifications)
          python3 deploy/android/apply_android_gradle.py
      - name: pub get
        script: flutter pub get
      - name: بناء APK (موحّد + مقسّم حسب المعمارية)
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # 🍎 iOS: بناء IPA غير موقّع → يوقّعه SideStore على جهازك بحساب Apple مجاني
  ios-ipa:
    name: iOS IPA لـ SideStore (بدون Mac)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: تجهيز منصة iOS
        script: |
          flutter create . --org com.multazim.app --platforms=ios
      - name: pub get
        script: flutter pub get
      - name: بناء .app غير موقّع (بدون archive — لا يتطلب Apple ID)
        script: flutter build ios --release --no-codesign
      - name: تغليف IPA يدوياً (Payload + zip — ما يقبله SideStore)
        script: |
          mkdir -p Payload
          cp -R "build/ios/iphoneos/Runner.app" Payload/
          zip -qr multazim-unsigned.ipa Payload
          rm -rf Payload
          ls -lh multazim-unsigned.ipa
    artifacts:
      - multazim-unsigned.ipa
