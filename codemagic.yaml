# ─────────────────────────────────────────────────────────────
# Codemagic CI — يطابق GitHub Actions في مصدر التوقيع والترقيم
# Android: signing secrets in the `multazim-android-signing` group.
# ─────────────────────────────────────────────────────────────
workflows:

  # 🤖 أندرويد: APK شامل موقّع — للتوزيع والتحديث فوق النسخة السابقة
  android-apk:
    name: Android APK (توقيع إصدار ثابت)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - multazim-android-signing
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: التحقق من الفرع الموثوق قبل تشغيل سكربتات المستودع
        script: |
          set -eu
          if [ "${CM_BRANCH:-}" != "main" ]; then
            echo "بناء التوزيع الموقّع مسموح من main فقط؛ اختر main أو ادمج التغييرات أولاً." >&2
            exit 1
          fi
      - name: تجهيز المنصة ونسخ ملفات النشر
        script: |
          set -eu
          cp deploy/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r deploy/icons/android/res/* android/app/src/main/res/
          cp deploy/android/app/proguard-rules.pro android/app/proguard-rules.pro
          mkdir -p android/app/src/main/res/raw
          cp assets/sounds/*.mp3 android/app/src/main/res/raw/
          # يحافظ على Java 17 وإعدادات Core Library Desugaring وProGuard/R8 الحالية.
          python3 deploy/android/apply_android_gradle.py
      - name: التحقق من التوقيع وبناء APK موقّع
        script: |
          set -eu
          signing_dir="$(mktemp -d "${TMPDIR:-/tmp}/multazim-signing.XXXXXX")"
          cleanup_signing() {
            python3 scripts/android_signing.py cleanup --temp-dir "$signing_dir"
          }
          trap cleanup_signing EXIT
          chmod 700 "$signing_dir"
          # نفس المتغيرات والتحقق المشترك المستخدمين في GitHub Actions.
          # ANDROID_KEYSTORE_BASE64 نص Base64 آمن؛ لا نعتمد على متغير *_PATH ضمني.
          python3 scripts/android_signing.py prepare --temp-dir "$signing_dir"
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/multazim-signed-release.apk
    artifacts:
      - build/app/outputs/flutter-apk/multazim-signed-release.apk

  # 🍎 iOS: بناء IPA غير موقّع → يوقّعه SideStore على جهازك بحساب Apple مجاني
  ios-ipa:
    name: iOS IPA لـ SideStore (بدون Mac)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: تجهيز منصة iOS
        script: |
          flutter create . --org com.multazim.app --platforms=ios
      - name: pub get
        script: flutter pub get
      - name: بناء .app غير موقّع (بدون archive — لا يتطلب Apple ID)
        script: flutter build ios --release --no-codesign
      - name: تغليف IPA يدوياً (Payload + zip — ما يقبله SideStore)
        script: |
          mkdir -p Payload
          cp -R "build/ios/iphoneos/Runner.app" Payload/
          zip -qr multazim-unsigned.ipa Payload
          rm -rf Payload
          ls -lh multazim-unsigned.ipa
    artifacts:
      - multazim-unsigned.ipa
