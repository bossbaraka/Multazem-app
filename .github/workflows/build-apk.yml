name: Build Multazim Release APK & Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality (Analyze)
        run: flutter analyze

      - name: Build APK (Release & Split ABI)
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build App Bundle (Google Play AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: multazim-release-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: multazim-google-play-bundle
          path: build/app/outputs/bundle/release/*.aab
